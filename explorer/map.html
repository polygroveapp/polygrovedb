<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Polygrove — pick your ecoregion</title>
<!-- THE APP'S ECOREGION PICKER (2026-09-28): the explorer's Ecoregions-page map,
     verbatim in look — black land, black water, grey hillshade (BLACK AND GREY
     again since 2026-10-05; earth-colour relief and blue water before that),
     thin green ecoregion borders, the chosen region filled green with a glowing
     green outline, green ecoregion names — served as a standalone page the phone
     app embeds in a WebView (MapLibre Native can't run in Expo Go). Talks to the
     app over window.ReactNativeWebView.postMessage:
       app → page: {type:'state', current, collected:[eid…], fly, pad:{top,bottom}}  (collected = visited → strong green)
                   + camp (your ecoregion → brown border) · completed:[eid…] (finished decks → gold inside)
       app → page: window.polygroveSetMarks([[lng,lat]…])  (your sightings → yellow ✕ marks)
     page → app: {type:'mark', ids:[observation id…], ok, lng, lat}  (a tap on a ✕)
     page → app: {type:'under', marks:[{id, kind}…]}  (the ✕ marks under the pin, nearest first)
     app → page: window.polygroveRelief(on)  (earth colours on the picker, or the grey/black look)
     app → page: window.polygroveBorders(on)  (every ecoregion's dashed outline, on or off)
     page → app: {type:'ready'} · {type:'center', eid|null, name, bbox} · {type:'bearing', deg} · {type:'pan', dx, dy}
     PIN PICKING (user, 2026-09-28): the phone draws a fixed pin; the region
     under the pin is the selection (green) and is reported on every moveend.
     `pad` is the app's chrome (header / preview sheet) in CSS px, so the pin
     sits in the middle of the VISIBLE map and fly-to centres there too.
     Parks (brown dots + names) and NPS trails (orange, lazy at z≥5.5) as on
     the explorer (user, 2026-09-28). Same data files and fonts, same origin. -->
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0d0d0d;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{display:none}
</style>
</head>
<body>
<div id="map"></div>
<script>
const RN = window.ReactNativeWebView;
// MINI MODE (user, 2026-09-28: "place on the map" on the home page): ?mini=EID
// renders the region's place on the globe — non-interactive, fitted to the
// region, no pin/labels chatter — for a small WebView on the phone's home
const MINI = (() => { const m = /[?&]mini=(\d+)/.exec(location.search); return m ? +m[1] : null; })();
// RANGE MODE (user, 2026-10-06, the PolygroveDB tab's species page): ?range=<sci>
// draws the website's range map — every ecoregion the species is recorded in,
// filled by its share of records, with the ✕ observation cells — fitted to
// the range. Still by default (a picture in the page); &live=1 makes it
// pannable for the full-screen view. No pin, no sheet, nothing sent.
const RANGE = (() => { const m = /[?&]range=([^&]+)/.exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null; })();
const LIVE = /[?&]live=1/.test(location.search);
const PASSIVE = MINI != null || RANGE != null;   // no picker behaviour: no pin, no reports, no high-detail swaps
const send = (m) => { try { RN ? RN.postMessage(JSON.stringify(m)) : console.log('msg', m); } catch (e) {} };

const map = new maplibregl.Map({
  fadeDuration: 0,   // symbols appear and go without the 300ms cross-fade — the ✕s "jiggled" as placement re-ran (2026-10-06)
  // minZoom 1.3: further out the whole world fits the screen's height and
  // MapLibre then refuses to pan vertically — the map could only slide
  // sideways (user, 2026-09-29, opening with no camp chosen)
  container: 'map', center: [12, 22], zoom: 1.5, minZoom: PASSIVE ? 0 : 1.3, maxZoom: 13, doubleClickZoom: false,
  interactive: !PASSIVE || (RANGE != null && LIVE),
  // mini mode keeps its pixels so it can hand the app a snapshot (below)
  canvasContextAttributes: MINI != null ? { preserveDrawingBuffer: true } : undefined,
  attributionControl: false, pitchEnabled: false, dragRotate: false, touchPitch: false, maxPitch: 60,
  style: { version: 8, glyphs: 'fonts/{fontstack}/{range}.pbf', sources: {},
           layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0d0d0d' } }] },
});
// north-up only: the compass was removed the day it was added (user, 2026-09-29)
map.touchZoomRotate.disableRotation();

let current = null, collected = [], ready = false, pendingState = null, GEO = null;
// THE ONE SCALE (user, 2026-10-05, settled on the black-and-grey map: "have
// it so the colors go from green to yellow from 0 to 100"; orange → yellow
// for an hour before that, dark green → gold before that): every ecoregion
// you've been to is coloured by how far its deck is mastered, GREEN at
// nothing → YELLOW at all of it. Your camp wears its own colour on that
// scale and is HIGHLIGHTED — a glowing border and a stronger fill — not
// flashing ("actually not flashing, but have it highlighted", same day).
const ZERO_GREEN = '#4CAF50', FULL_YELLOW = '#FFE14D';
// THE SCALE (user, 2026-10-06): near-black at 0% → green at 50% → yellow at
// 100%, and a finished region's yellow breathes toward white
const ZERO_DARK = '#0b150c', MID_GREEN = ZERO_GREEN, GOLD_WHITE = '#FFF27A';   // a finished region breathes yellow → bright yellow, never white (user, 2026-10-06); 0% is nearly the map's black
// UNDER THE PIN: green, and FLASHING (user, 2026-10-05: "have the one under
// the pin be green, but flashing"; white for a few hours before that)
const SEL_GREEN = '#4CAF50', SEL_PALE = '#a5e8a9';
let camp = null, completed = [];   // your camp (brown border) · mastered decks (gold border + inside)
let progress = {};                 // eco id → 0..1, how far its deck is mastered (visited fill: dark → bright green → gold)
let PAD = { top: 0, bottom: 0 };
const TERRAIN = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';

map.on('load', async () => {
  const [geo, lakes, labels, parks, cities] = await Promise.all([
    fetch('data/eco_simple.geojson', { cache: 'no-cache' }).then(r => r.json()),
    fetch('data/lakes.geojson', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('data/admin_labels.geojson', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('data/parks.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('data/cities.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
  ]);
  GEO = geo;
  // every feature carries its ecoregion id as its feature id (2026-10-07) —
  // set on the data itself; promoteId is not honoured by this build
  const ROUND_COAST = { 'line-join': 'round', 'line-cap': 'round' };
// the shore of a set of ecoregions: every ring segment that only one region owns, chained into lines
function coastOf(fc) {
  const K = (p) => Math.round(p[0] * 1e5) + ',' + Math.round(p[1] * 1e5);
  const count = new Map(), pts = new Map();
  for (const f of fc.features) {
    const g = f.geometry, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
    for (const poly of polys) for (const ring of poly) {
      let ka = K(ring[0]); pts.set(ka, ring[0]);
      for (let i = 1; i < ring.length; i++) {
        const kb = K(ring[i]);
        if (kb !== ka) { pts.set(kb, ring[i]); const k = ka < kb ? ka + '|' + kb : kb + '|' + ka; count.set(k, (count.get(k) || 0) + 1); }
        ka = kb;
      }
    }
  }
  // lone segments, minus the cuts along the antimeridian and the south pole
  const adj = new Map(), add = (a, b) => { let l = adj.get(a); if (!l) adj.set(a, l = []); l.push(b); };
  for (const [k, n] of count) {
    if (n !== 1) continue;
    const [a, b] = k.split('|'), pa = pts.get(a), pb = pts.get(b);
    if ((Math.abs(pa[0]) > 179.99 && Math.abs(pb[0]) > 179.99) || (pa[1] < -89.9 && pb[1] < -89.9)) continue;
    add(a, b); add(b, a);
  }
  const lines = [];
  for (const start of adj.keys()) {
    for (;;) {
      const first = adj.get(start); if (!first || !first.length) break;
      const line = [pts.get(start)]; let cur = start;
      for (;;) {
        const l = adj.get(cur); if (!l || !l.length) break;
        const nxt = l.pop(), back = adj.get(nxt); back.splice(back.indexOf(cur), 1);
        line.push(pts.get(nxt)); cur = nxt;
      }
      if (line.length > 1) lines.push(line);
    }
  }
  return { type: 'Feature', geometry: { type: 'MultiLineString', coordinates: lines }, properties: {} };
}
const withIds = (fc) => { for (const f of fc.features) f.id = +f.properties.eco; return fc; };
  map.addSource('eco', { type: 'geojson', data: withIds(geo) });
  // the explorer's Ecoregions-page stack, in order
  map.addLayer({ id: 'land', type: 'fill', source: 'eco', paint: { 'fill-color': '#1c1c1c', 'fill-outline-color': '#2e2e2e' } });
  // PICKING LAYER (2026-09-30): invisible, never filtered. The visible 'land'
  // hides every region whose high-detail twin is loaded, and there is a moment
  // between that filter and the twin actually drawing when the pin sat over
  // nothing — on a phone whose tilt keeps the map from ever going idle, that
  // moment could stick. The pick asks the HD layer first, then this one.
  map.addLayer({ id: 'land_pick', type: 'fill', source: 'eco', paint: { 'fill-color': '#000000', 'fill-opacity': 0 } });
  // HIGH DETAIL (user, 2026-09-29: "the ecoregions don't fit the map exactly
  // … be accurate"): once zoomed in, every ecoregion on screen is replaced by
  // its own high-detail outline (data/eco_hd/<id>.json, 30% of RESOLVE's raw
  // vertices, shared borders intact, bay islands included). They live in a
  // second source with twin layers; a region that has its HD twin is filtered
  // out of the low-detail layers.
  map.addSource('ecohd', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'land_hd', type: 'fill', source: 'ecohd', paint: { 'fill-color': '#1c1c1c', 'fill-outline-color': '#2e2e2e' } });
  // BLACK AND GREY (user, 2026-10-05: "the species map and the map on the app
  // have to go back to the black and grey look"): no colour relief — black
  // land, black water, and only the hillshade below to model the terrain in
  // greys. (The earth-colour tint ran from 2026-09-28 until then.)
  map.addSource('demshade', { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 13, tiles: [TERRAIN] });
  map.addLayer({ id: 'hillshade', type: 'hillshade', source: 'demshade',
    paint: { 'hillshade-exaggeration': 0.67, 'hillshade-shadow-color': '#000000',
             'hillshade-highlight-color': 'rgba(255,255,255,0.09)', 'hillshade-accent-color': 'rgba(0,0,0,0.33)' } });
  if (lakes) {
    // a = the lake's bounding-box area in square degrees: its size class for naming
    for (const f of lakes.features) {
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
      let w = 180, s0 = 90, e = -180, n = -90;
      for (const p of polys) for (const [x, y] of p[0]) { if (x < w) w = x; if (x > e) e = x; if (y < s0) s0 = y; if (y > n) n = y; }
      f.properties.a = Math.round((e - w) * (n - s0) * 100) / 100;
    }
    map.addSource('lakes', { type: 'geojson', data: lakes });
    map.addLayer({ id: 'lakes', type: 'fill', source: 'lakes', paint: { 'fill-color': '#1d4266', 'fill-opacity': 0.85, 'fill-outline-color': '#2f5e8c' } });
  }
  // THE COAST, A WHITE LINE (user, 2026-10-07: "a white line for the coasts to
  // make that more distinct"). No coastline file: neighbouring ecoregions
  // share their borders exactly, so a border segment that belongs to only
  // ONE region has no land on its other side — it is the shore (or a lake
  // shore, or an ice edge). coastOf() counts the segments and chains the
  // lone ones into lines; it runs once per geometry (first paint, then the
  // detailed file). Drawn above the land and the colour relief, below names.
  map.addSource('coast', { type: 'geojson', data: coastOf(geo) });
  map.addLayer({ id: 'coast', type: 'line', source: 'coast', layout: ROUND_COAST,
    paint: { 'line-color': '#ffffff', 'line-opacity': 0.72,
             'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.45, 4, 0.8, 7, 1.2, 10, 1.6] } });
  // DETAILED BORDERS once zoomed in (2026-09-29): the first-paint geometry is
  // ~60k vertices; past z3.2 the ~450k-vertex file replaces it. Both are
  // topologically simplified, so neighbours share their borders exactly.
  let detail = false;
  const loadDetail = () => {
    if (detail || PASSIVE || map.getZoom() < 3.2) return;
    detail = true; map.off('zoomend', loadDetail);
    fetch('data/eco_detail.geojson', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null)
      .then(d => { if (d && map.getSource('eco')) { for (const f of d.features) f.id = +f.properties.eco; map.getSource('eco').setData(d); if (map.getSource('coast')) map.getSource('coast').setData(coastOf(d)); } else detail = false; })
      .catch(() => { detail = false; });
  };
  map.on('zoomend', loadDetail);
  map.on('moveend', loadHD);
  map.on('idle', loadHD);   // and once the new view has actually drawn — a jump lands before its tiles do
  // PARK BOUNDARIES in the explorer's brown, as SOLID lines (user,
  // 2026-09-29): the NPS polygons that matched a named park, fetched after
  // first paint so they never delay the map
  if (!PASSIVE) fetch('data/park_bounds.geojson', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(pb => {
    if (!pb || map.getSource('parkbounds')) return;
    // the NPS file also carries battlefields, parkways and historic sites: only
    // a boundary whose name matches a park label sitting inside (or near) it
    // draws — the explorer's rule, recomputed here (mm = matched)
    if (parks) {
      const pnorm = n => (n || '').toLowerCase()
        .replace(/ (national|memorial|state|provincial) (park complex|park reserve|park and preserve|park|preserve|monument|reserve|recreation area|battlefield|historical park|historic site|seashore|lakeshore|river|parkway)s?$/, '')
        .replace(/ national parks?$/, '').trim();
      const byName = new Map();
      for (const f of pb.features) {
        let w = 180, s0 = 90, e = -180, n = -90;
        const walk = cs => { for (const c of cs) Array.isArray(c[0]) ? walk(c) : (w = Math.min(w, c[0]), e = Math.max(e, c[0]), s0 = Math.min(s0, c[1]), n = Math.max(n, c[1])); };
        if (f.geometry && f.geometry.coordinates) walk(f.geometry.coordinates);
        const k = pnorm(f.properties.name);
        (byName.get(k) || byName.set(k, []).get(k)).push({ box: [w - 1.5, s0 - 1.5, e + 1.5, n + 1.5], f });
      }
      for (const f of parks.features) {
        const [x, y] = f.geometry.coordinates;
        for (const c of byName.get(pnorm(f.properties.name)) || [])
          if (x >= c.box[0] && x <= c.box[2] && y >= c.box[1] && y <= c.box[3]) { c.f.properties.mm = 1; f.properties.hb = 1; }
      }
      // a park with a border needs no dot in the middle (user, 2026-09-30) —
      // the website's rule (hb = has boundary); the name tucks in closer
      if (map.getSource('parks')) map.getSource('parks').setData(parks);
    }
    map.addSource('parkbounds', { type: 'geojson', data: pb });
    map.addLayer({ id: 'parkline', type: 'line', source: 'parkbounds', filter: ['==', ['get', 'mm'], 1],
      paint: { 'line-color': '#c49a76', 'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.4, 4, 0.9, 7, 1.6, 10, 2.2],
               'line-opacity': ['interpolate', ['linear'], ['zoom'], 1, 0.5, 4, 0.8] } },
      map.getLayer('selglow') ? 'selglow' : undefined);
  }).catch(() => {});
  // every ecoregion outlined thin green (dashed, as on the Ecoregions page)
  // every line is drawn with ROUND joins and caps (user, 2026-09-29: "smooth
  // out the edges a bit"); each layer has an HD twin on the ecohd source
  const ROUND = { 'line-join': 'round', 'line-cap': 'round' };
  const twin = (id, def) => { map.addLayer(Object.assign({ id, source: 'eco' }, def)); map.addLayer(Object.assign({ id: id + '_hd', source: 'ecohd' }, def)); };
  // NO BASE BORDERS on the picker (user, 2026-10-07: "take out the borders of
  // the ecoregions"): only the region under the pin, your camp and the
  // mastered ones draw an outline. The layer stays (the Camp picture and the
  // range map still use it) at opacity 0 here.
  twin('ecoline', { type: 'line', layout: ROUND,
    paint: { 'line-color': '#81C784', 'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.4, 5, 0.8, 7.5, 1.2],
             'line-opacity': PASSIVE ? 0.6 : 0, 'line-dasharray': [1.6, 1.9] } });
  // ecoregions you've been to (hold cards in): a stronger, solid green
  // outline (user, 2026-09-28 — was gold)
  // (hidden since 2026-10-06 — user: "no borders should be highlighted besides
  // when the pin's over it"; the fill carries the mastery colour)
  twin('visited', { type: 'line', layout: ROUND, filter: ['in', ['get', 'eco'], ['literal', []]],
    paint: { 'line-color': ZERO_GREEN, 'line-width': 2, 'line-opacity': 0 } });
  // the chosen ecoregion: green fill + glowing green outline (ecohl-glow / ecohl)
  // MASTERY PAINT (user, 2026-09-30, "the green to light green to gold is
  // the fill on the inside"): an ecoregion you've been to is painted inside
  // from a dark green (nothing mastered) to a bright green (nearly all) and
  // GOLD once every card in its deck is mastered — under the pin's green so
  // the selection still reads. (Was: gold inside once every card was
  // journaled, 2026-09-29.)
  twin('visitfill', { type: 'fill', filter: ['in', ['get', 'eco'], ['literal', []]],
    paint: { 'fill-color': ZERO_GREEN, 'fill-opacity': 0.42 } });
  // THE SELECTION IS FEATURE-STATE (2026-10-07 — user: "the ecoregions lag
  // behind … it looks really clunky"). Before, the pinned region was picked
  // out by a layer FILTER, and every change made MapLibre re-tile the whole
  // ecoregion layer, so the highlight trailed the pin by a beat; the fade
  // then needed a second set of layers (psel*) for the region being left.
  // Now the glow and line layers cover every region, their opacity reads a
  // per-region `sel`/`lin` state, and the paint EXPRESSIONS NEVER CHANGE —
  // any per-frame change to a data-driven paint property makes MapLibre
  // reload the source's tiles (which is what made every earlier version
  // stall). The fade AND the pulse ride inside the state values, set per
  // frame with setFeatureState, which is a plain repaint. The colour is a
  // match over the visited regions' mastery, set only when the state changes.
  // The picker never fills the selection (user, 2026-10-06); the Camp picture's
  // gold fill is one fixed region, so a plain filter does there.
  twin('selfill', { type: 'fill', filter: ['==', ['get', 'eco'], MINI != null ? MINI : -1], paint: { 'fill-color': SEL_GREEN, 'fill-opacity': MINI != null ? SEL_OPACITY.fill : 0 } });
  twin('selglow', { type: 'line', layout: ROUND, paint: { 'line-color': SEL_GREEN, 'line-width': 9, 'line-blur': 7,
    'line-opacity': ['min', 1, ['*', SEL_OPACITY.glow, ['coalesce', ['feature-state', 'sel'], 0]]] } });
  twin('selline', { type: 'line', layout: ROUND, paint: { 'line-color': SEL_GREEN, 'line-width': 2,
    'line-opacity': ['min', 1, ['*', SEL_OPACITY.line, ['coalesce', ['feature-state', 'lin'], 0]]] } });
  // YOUR CAMP — the ecoregion you are in — is bordered in a glowing bright
  // GREEN (user, 2026-09-30: "only the ecoregion you're in highlighted
  // green, don't use the brown"; brown from 2026-09-29, gold for an hour
  // before that), drawn over the pin's outline so it never disappears
  // …ORANGE (user, 2026-10-05: "have your currently selected one orange,
  // and gold only for 100% completion"; yellow/gold since 2026-09-30): an
  // orange glow, a pale orange line over it, and an orange fill that
  // breathes between faint and warm, ~2.4s. GOLD now means one thing only —
  // a deck mastered to 100% — so a camp that IS complete keeps its orange
  // border (you're here) and is painted gold inside (applyFilters)
  twin('campfill', { type: 'fill', filter: ['==', ['get', 'eco'], -1],
    paint: { 'fill-color': ZERO_GREEN, 'fill-opacity': 0.58 } });
  // the camp's glow and line are hidden too (2026-10-06): only the region under the pin gets a border
  twin('campglow', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': ZERO_GREEN, 'line-width': 9, 'line-blur': 6, 'line-opacity': 0 } });
  twin('campline', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#ffd0a0', 'line-width': 2.4, 'line-opacity': 0 } });
  // green ecoregion names, placed on the polygons
  map.addLayer({ id: 'ecolbl', type: 'symbol', source: 'eco', minzoom: 2.4,
    layout: { 'symbol-placement': 'point', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
              'text-size': ['interpolate', ['linear'], ['zoom'], 2.4, 9, 6, 12], 'text-max-width': 9, 'text-padding': 6 },
    paint: { 'text-color': '#81C784', 'text-halo-color': '#0d0d0d', 'text-halo-width': 1.2, 'text-opacity': 0.9 } });
  // PARKS (user, 2026-09-28): the explorer's park markers — brown dot + name,
  // fame-tiered so Yellowstone shows at world zoom and the county reserve
  // appears as you arrive
  if (parks) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 8;
    const g = cv.getContext('2d'); g.fillStyle = '#c49a76'; g.beginPath(); g.arc(4, 4, 3, 0, 7); g.fill();
    map.addImage('parkpt', g.getImageData(0, 0, 8, 8), { pixelRatio: 2 });
    map.addSource('parks', { type: 'geojson', data: parks });
    // AS MANY PARK NAMES AS FIT (user, 2026-09-29): no fame tiers — every
    // park competes at every zoom and the collision engine keeps whatever
    // fits, the famous first (lowest sort key is placed first). Tight padding
    // and four candidate anchors let more names land.
    const famous = ['-', 0, ['coalesce', ['get', 'fame'], 0]];
    // FEWER NAMES (user, 2026-10-07): fame tiers again — the big names at
    // continental zoom (fame ≥ 50: Yellowstone, Grand Canyon, Carlsbad
    // Caverns), the well-known from z4.5 (≥ 25), the rest only from z6.5 —
    // and wider spacing between the ones that do show
    const tier = ['step', ['zoom'], ['>=', ['coalesce', ['get', 'fame'], 0], 50], 4.5, ['>=', ['coalesce', ['get', 'fame'], 0], 25], 6.5, true];
    map.addLayer({ id: 'parkdot', type: 'symbol', source: 'parks', minzoom: 0.8, filter: ['all', ['!=', ['get', 'hb'], 1], tier],

    const feats = cells.map(([cx, cy, n]) => ({ type: 'Feature', properties: { n: n || 1 }, geometry: { type: 'Point', coordinates: [cx / 100 + 0.005, cy / 100 + 0.005] } }));
    map.addSource('obs', { type: 'geojson', data: { type: 'FeatureCollection', features: feats } });
    if (!map.hasImage('xpt')) {
      const z = 36, cv = document.createElement('canvas'); cv.width = cv.height = z;
      const g = cv.getContext('2d'), c = z / 2, r = z / 2 - 5;
      g.strokeStyle = '#ffffff'; g.lineWidth = 6.4; g.lineCap = 'round'; g.beginPath();
      g.moveTo(c - r, c - r); g.lineTo(c + r, c + r); g.moveTo(c - r, c + r); g.lineTo(c + r, c - r); g.stroke();
      map.addImage('xpt', g.getImageData(0, 0, z, z), { pixelRatio: 2, sdf: true });
    }
    const byCount = ['interpolate', ['linear'], ['sqrt', ['get', 'n']], 1, 0.4, 100, 0.75, 3000, 1.1];
    map.addLayer({ id: 'obsdots', type: 'symbol', source: 'obs',
      layout: { 'icon-image': 'xpt', 'icon-allow-overlap': true, 'icon-ignore-placement': true,
                'icon-size': ['interpolate', ['exponential', 1.5], ['zoom'], 0, ['*', 0.4, byCount], 3, ['*', 0.88, byCount], 6, ['*', 2.7, byCount], 9, ['*', 5, byCount]] },
      paint: { 'icon-color': '#ffe14d', 'icon-halo-color': 'rgba(255,215,0,0.5)', 'icon-halo-width': 2, 'icon-halo-blur': 3 } });
  }
  let w = 180, s2 = 90, e = -180, n = -90, hit = false;
  for (const id of ids) { const b = bboxOf(id); if (!b) continue; hit = true; w = Math.min(w, b[0]); s2 = Math.min(s2, b[1]); e = Math.max(e, b[2]); n = Math.max(n, b[3]); }
  if (hit) map.fitBounds([[w, s2], [e, n]], { padding: LIVE ? 30 : 18, maxZoom: 8, duration: 0 });
  map.once('idle', () => send({ type: 'range-ready', ecoregions: ids.length, cells: cells.length }));
}
window.polygroveTilt = (pitch, bearing) => { if (ready && !touching && !map.isEasing()) map.jumpTo({ pitch, bearing }); };
</script>
