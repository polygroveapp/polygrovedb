<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Polygrove — pick your ecoregion</title>
<!-- THE APP'S ECOREGION PICKER (2026-09-28): the explorer's Ecoregions-page map,
     verbatim in look — black land, deep-blue water, terrain relief + hillshade,
     thin green ecoregion borders, the chosen region filled green with a glowing
     green outline, green ecoregion names — served as a standalone page the phone
     app embeds in a WebView (MapLibre Native can't run in Expo Go). Talks to the
     app over window.ReactNativeWebView.postMessage:
       app → page: {type:'state', current, collected:[eid…], fly, pad:{top,bottom}}  (collected = visited → strong green)
                   + camp (your ecoregion → brown border) · completed:[eid…] (finished decks → gold inside)
       page → app: {type:'ready'} · {type:'center', eid|null, name, bbox} · {type:'bearing', deg} · {type:'pan', dx, dy}
     PIN PICKING (user, 2026-09-28): the phone draws a fixed pin; the region
     under the pin is the selection (green) and is reported on every moveend.
     `pad` is the app's chrome (header / preview sheet) in CSS px, so the pin
     sits in the middle of the VISIBLE map and fly-to centres there too.
     Parks (brown dots + names) and NPS trails (orange, lazy at z≥5.5) as on
     the explorer (user, 2026-09-28). Same data files and fonts, same origin. -->
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b1a29;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{display:none}
</style>
</head>
<body>
<div id="map"></div>
<script>
const RN = window.ReactNativeWebView;
// MINI MODE (user, 2026-09-28: "place on the map" on the home page): ?mini=EID
// renders the region's place on the globe — non-interactive, fitted to the
// region, no pin/labels chatter — for a small WebView on the phone's home
const MINI = (() => { const m = /[?&]mini=(\d+)/.exec(location.search); return m ? +m[1] : null; })();
const send = (m) => { try { RN ? RN.postMessage(JSON.stringify(m)) : console.log('msg', m); } catch (e) {} };

const map = new maplibregl.Map({
  // minZoom 1.3: further out the whole world fits the screen's height and
  // MapLibre then refuses to pan vertically — the map could only slide
  // sideways (user, 2026-09-29, opening with no camp chosen)
  container: 'map', center: [12, 22], zoom: 1.5, minZoom: MINI == null ? 1.3 : 0, maxZoom: 13, doubleClickZoom: false,
  interactive: MINI == null,
  // mini mode keeps its pixels so it can hand the app a snapshot (below)
  canvasContextAttributes: MINI != null ? { preserveDrawingBuffer: true } : undefined,
  attributionControl: false, pitchEnabled: false, dragRotate: false, touchPitch: false, maxPitch: 60,
  style: { version: 8, glyphs: 'fonts/{fontstack}/{range}.pbf', sources: {},
           layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0b1a29' } }] },
});
// north-up only: the compass was removed the day it was added (user, 2026-09-29)
map.touchZoomRotate.disableRotation();

let current = null, collected = [], ready = false, pendingState = null, GEO = null;
let camp = null, completed = [];   // your camp (brown border) · mastered decks (gold border + inside)
let progress = {};                 // eco id → 0..1, how far its deck is mastered (visited fill: dark → bright green → gold)
let PAD = { top: 0, bottom: 0 };
const TERRAIN = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';

map.on('load', async () => {
  const [geo, lakes, labels, parks, cities] = await Promise.all([
    fetch('data/eco_simple.geojson', { cache: 'no-cache' }).then(r => r.json()),
    fetch('data/lakes.geojson', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('data/admin_labels.geojson', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('data/parks.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
    fetch('data/cities.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null),
  ]);
  GEO = geo;
  map.addSource('eco', { type: 'geojson', data: geo });
  // the explorer's Ecoregions-page stack, in order
  map.addLayer({ id: 'land', type: 'fill', source: 'eco', paint: { 'fill-color': '#1c1c1c', 'fill-outline-color': '#2e2e2e' } });
  // PICKING LAYER (2026-09-30): invisible, never filtered. The visible 'land'
  // hides every region whose high-detail twin is loaded, and there is a moment
  // between that filter and the twin actually drawing when the pin sat over
  // nothing — on a phone whose tilt keeps the map from ever going idle, that
  // moment could stick. The pick asks the HD layer first, then this one.
  map.addLayer({ id: 'land_pick', type: 'fill', source: 'eco', paint: { 'fill-color': '#000000', 'fill-opacity': 0 } });
  // HIGH DETAIL (user, 2026-09-29: "the ecoregions don't fit the map exactly
  // … be accurate"): once zoomed in, every ecoregion on screen is replaced by
  // its own high-detail outline (data/eco_hd/<id>.json, 30% of RESOLVE's raw
  // vertices, shared borders intact, bay islands included). They live in a
  // second source with twin layers; a region that has its HD twin is filtered
  // out of the low-detail layers.
  map.addSource('ecohd', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'land_hd', type: 'fill', source: 'ecohd', paint: { 'fill-color': '#1c1c1c', 'fill-outline-color': '#2e2e2e' } });
  map.addSource('demtint', { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 13, tiles: [TERRAIN] });
  map.addLayer({ id: 'relief', type: 'color-relief', source: 'demtint',
    paint: { 'color-relief-opacity': 0.7,
      'color-relief-color': ['interpolate', ['linear'], ['elevation'],
        -6000, '#0e1f2e', -1500, '#14293c', -100, '#1b384d', 0, '#26402d',
        300, '#2f4a33', 800, '#48603c', 1400, '#6b6f46', 2100, '#786740',
        2900, '#665244', 3800, '#6e675e', 4800, '#98978f', 6500, '#c9c9c4'] } });
  map.addSource('demshade', { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 13, tiles: [TERRAIN] });
  map.addLayer({ id: 'hillshade', type: 'hillshade', source: 'demshade',
    paint: { 'hillshade-exaggeration': 0.67, 'hillshade-shadow-color': '#000000',
             'hillshade-highlight-color': 'rgba(255,255,255,0.09)', 'hillshade-accent-color': 'rgba(0,0,0,0.33)' } });
  if (lakes) {
    // a = the lake's bounding-box area in square degrees: its size class for naming
    for (const f of lakes.features) {
      const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
      let w = 180, s0 = 90, e = -180, n = -90;
      for (const p of polys) for (const [x, y] of p[0]) { if (x < w) w = x; if (x > e) e = x; if (y < s0) s0 = y; if (y > n) n = y; }
      f.properties.a = Math.round((e - w) * (n - s0) * 100) / 100;
    }
    map.addSource('lakes', { type: 'geojson', data: lakes });
    map.addLayer({ id: 'lakes', type: 'fill', source: 'lakes', paint: { 'fill-color': '#1d4266', 'fill-opacity': 0.85, 'fill-outline-color': '#2f5e8c' } });
  }
  // DETAILED BORDERS once zoomed in (2026-09-29): the first-paint geometry is
  // ~60k vertices; past z3.2 the ~450k-vertex file replaces it. Both are
  // topologically simplified, so neighbours share their borders exactly.
  let detail = false;
  const loadDetail = () => {
    if (detail || MINI != null || map.getZoom() < 3.2) return;
    detail = true; map.off('zoomend', loadDetail);
    fetch('data/eco_detail.geojson', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null)
      .then(d => { if (d && map.getSource('eco')) map.getSource('eco').setData(d); else detail = false; })
      .catch(() => { detail = false; });
  };
  map.on('zoomend', loadDetail);
  map.on('moveend', loadHD);
  map.on('idle', loadHD);   // and once the new view has actually drawn — a jump lands before its tiles do
  // PARK BOUNDARIES in the explorer's brown, as SOLID lines (user,
  // 2026-09-29): the NPS polygons that matched a named park, fetched after
  // first paint so they never delay the map
  if (MINI == null) fetch('data/park_bounds.geojson', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(pb => {
    if (!pb || map.getSource('parkbounds')) return;
    // the NPS file also carries battlefields, parkways and historic sites: only
    // a boundary whose name matches a park label sitting inside (or near) it
    // draws — the explorer's rule, recomputed here (mm = matched)
    if (parks) {
      const pnorm = n => (n || '').toLowerCase()
        .replace(/ (national|memorial|state|provincial) (park complex|park reserve|park and preserve|park|preserve|monument|reserve|recreation area|battlefield|historical park|historic site|seashore|lakeshore|river|parkway)s?$/, '')
        .replace(/ national parks?$/, '').trim();
      const byName = new Map();
      for (const f of pb.features) {
        let w = 180, s0 = 90, e = -180, n = -90;
        const walk = cs => { for (const c of cs) Array.isArray(c[0]) ? walk(c) : (w = Math.min(w, c[0]), e = Math.max(e, c[0]), s0 = Math.min(s0, c[1]), n = Math.max(n, c[1])); };
        if (f.geometry && f.geometry.coordinates) walk(f.geometry.coordinates);
        const k = pnorm(f.properties.name);
        (byName.get(k) || byName.set(k, []).get(k)).push({ box: [w - 1.5, s0 - 1.5, e + 1.5, n + 1.5], f });
      }
      for (const f of parks.features) {
        const [x, y] = f.geometry.coordinates;
        for (const c of byName.get(pnorm(f.properties.name)) || [])
          if (x >= c.box[0] && x <= c.box[2] && y >= c.box[1] && y <= c.box[3]) { c.f.properties.mm = 1; f.properties.hb = 1; }
      }
      // a park with a border needs no dot in the middle (user, 2026-09-30) —
      // the website's rule (hb = has boundary); the name tucks in closer
      if (map.getSource('parks')) map.getSource('parks').setData(parks);
    }
    map.addSource('parkbounds', { type: 'geojson', data: pb });
    map.addLayer({ id: 'parkline', type: 'line', source: 'parkbounds', filter: ['==', ['get', 'mm'], 1],
      paint: { 'line-color': '#c49a76', 'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.4, 4, 0.9, 7, 1.6, 10, 2.2],
               'line-opacity': ['interpolate', ['linear'], ['zoom'], 1, 0.5, 4, 0.8] } },
      map.getLayer('selglow') ? 'selglow' : undefined);
  }).catch(() => {});
  // every ecoregion outlined thin green (dashed, as on the Ecoregions page)
  // every line is drawn with ROUND joins and caps (user, 2026-09-29: "smooth
  // out the edges a bit"); each layer has an HD twin on the ecohd source
  const ROUND = { 'line-join': 'round', 'line-cap': 'round' };
  const twin = (id, def) => { map.addLayer(Object.assign({ id, source: 'eco' }, def)); map.addLayer(Object.assign({ id: id + '_hd', source: 'ecohd' }, def)); };
  twin('ecoline', { type: 'line', layout: ROUND,
    paint: { 'line-color': '#81C784', 'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.4, 5, 0.8, 7.5, 1.2],
             'line-opacity': 0.6, 'line-dasharray': [1.6, 1.9] } });
  // ecoregions you've been to (hold cards in): a stronger, solid green
  // outline (user, 2026-09-28 — was gold)
  twin('visited', { type: 'line', layout: ROUND, filter: ['in', ['get', 'eco'], ['literal', []]],
    paint: { 'line-color': '#4CAF50', 'line-width': 2, 'line-opacity': 0.95 } });
  // the chosen ecoregion: green fill + glowing green outline (ecohl-glow / ecohl)
  // MASTERY PAINT (user, 2026-09-30, "the green to light green to gold is
  // the fill on the inside"): an ecoregion you've been to is painted inside
  // from a dark green (nothing mastered) to a bright green (nearly all) and
  // GOLD once every card in its deck is mastered — under the pin's green so
  // the selection still reads. (Was: gold inside once every card was
  // journaled, 2026-09-29.)
  twin('visitfill', { type: 'fill', filter: ['in', ['get', 'eco'], ['literal', []]],
    paint: { 'fill-color': '#1e5a24', 'fill-opacity': 0.42 } });
  // CROSSFADE (user, 2026-09-30: "have the changing green fill fade in and
  // out to make it smoother"): the region the pin just left keeps its own
  // set of layers (psel*) fading out while the new one fades in
  twin('pselfill', { type: 'fill', filter: ['==', ['get', 'eco'], -1],
    paint: { 'fill-color': '#4CAF50', 'fill-opacity': 0 } });
  twin('pselglow', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#4CAF50', 'line-width': 9, 'line-blur': 7, 'line-opacity': 0 } });
  twin('pselline', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#a5e8a9', 'line-width': 2, 'line-opacity': 0 } });
  twin('selfill', { type: 'fill', filter: ['==', ['get', 'eco'], -1],
    paint: { 'fill-color': '#4CAF50', 'fill-opacity': 0.45 } });
  twin('selglow', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#4CAF50', 'line-width': 9, 'line-blur': 7, 'line-opacity': 0.6 } });
  twin('selline', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#a5e8a9', 'line-width': 2, 'line-opacity': 1 } });
  // YOUR CAMP — the ecoregion you are in — is bordered in a glowing bright
  // GREEN (user, 2026-09-30: "only the ecoregion you're in highlighted
  // green, don't use the brown"; brown from 2026-09-29, gold for an hour
  // before that), drawn over the pin's outline so it never disappears
  // …and the glow is YELLOW (user, 2026-09-30, minutes after green): the
  // title's yellow, a pale yellow line over it
  twin('campglow', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#ffe14d', 'line-width': 9, 'line-blur': 6, 'line-opacity': 0.7 } });
  twin('campline', { type: 'line', layout: ROUND, filter: ['==', ['get', 'eco'], -1],
    paint: { 'line-color': '#fff3a6', 'line-width': 2.4, 'line-opacity': 1 } });
  // green ecoregion names, placed on the polygons
  map.addLayer({ id: 'ecolbl', type: 'symbol', source: 'eco', minzoom: 2.4,
    layout: { 'symbol-placement': 'point', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
              'text-size': ['interpolate', ['linear'], ['zoom'], 2.4, 9, 6, 12], 'text-max-width': 9, 'text-padding': 6 },
    paint: { 'text-color': '#81C784', 'text-halo-color': '#0d0d0d', 'text-halo-width': 1.2, 'text-opacity': 0.9 } });
  // PARKS (user, 2026-09-28): the explorer's park markers — brown dot + name,
  // fame-tiered so Yellowstone shows at world zoom and the county reserve
  // appears as you arrive
  if (parks) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 8;
    const g = cv.getContext('2d'); g.fillStyle = '#c49a76'; g.beginPath(); g.arc(4, 4, 3, 0, 7); g.fill();
    map.addImage('parkpt', g.getImageData(0, 0, 8, 8), { pixelRatio: 2 });
    map.addSource('parks', { type: 'geojson', data: parks });
    // AS MANY PARK NAMES AS FIT (user, 2026-09-29): no fame tiers — every
    // park competes at every zoom and the collision engine keeps whatever
    // fits, the famous first (lowest sort key is placed first). Tight padding
    // and four candidate anchors let more names land.
    const famous = ['-', 0, ['coalesce', ['get', 'fame'], 0]];
    map.addLayer({ id: 'parkdot', type: 'symbol', source: 'parks', minzoom: 0.8, filter: ['!=', ['get', 'hb'], 1],
      layout: { 'icon-image': 'parkpt', 'icon-padding': 0, 'symbol-sort-key': famous } });
    map.addLayer({ id: 'parklbl', type: 'symbol', source: 'parks', minzoom: 0.8,
      layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 1, 8, 4, 9.5, 7, 11],
                'symbol-sort-key': famous,
                'text-variable-anchor': ['top', 'bottom', 'left', 'right'],
                'text-radial-offset': ['case', ['==', ['get', 'hb'], 1], 0.15, 0.55],
                'text-max-width': 8, 'text-padding': 1 },
      paint: { 'text-color': '#c49a76', 'text-halo-color': '#0d0d0d', 'text-halo-width': 1.2 } });
  }
  // THE OCEANS (user, 2026-09-29): big, spaced-out names in water blue, world
  // zoom to mid zoom; large oceans get a name in each half
  if (MINI == null) {
    const oc = [['Pacific Ocean', -150, 25], ['Pacific Ocean', -125, -28], ['Pacific Ocean', 165, 12],
      ['Atlantic Ocean', -40, 30], ['Atlantic Ocean', -18, -25], ['Indian Ocean', 78, -22],
      ['Arctic Ocean', -150, 78], ['Arctic Ocean', 40, 82], ['Southern Ocean', 20, -62], ['Southern Ocean', -130, -64], ['Southern Ocean', 110, -60]];
    map.addSource('oceans', { type: 'geojson', data: { type: 'FeatureCollection', features: oc.map(([name, x, y]) =>
      ({ type: 'Feature', geometry: { type: 'Point', coordinates: [x, y] }, properties: { name } })) } });
    map.addLayer({ id: 'oceanlbl', type: 'symbol', source: 'oceans', maxzoom: 6,
      layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'], 'text-transform': 'uppercase',
                'text-size': ['interpolate', ['linear'], ['zoom'], 1, 10, 4, 15], 'text-letter-spacing': 0.35,
                'text-max-width': 6, 'text-padding': 2 },
      paint: { 'text-color': '#6d95bd', 'text-halo-color': '#0b1a29', 'text-halo-width': 1.2, 'text-opacity': 0.85 } });
  }
  // MAJOR CITIES with a SQUARE mark: BLACK inside, GREY border — name and
  // square alike (user, 2026-09-29, after blue, black-on-white and all-grey),
  // the explorer's tiers: megacities at world zoom, 1M+ by z2.4, the rest by z4
  if (cities && MINI == null) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 12;
    const g = cv.getContext('2d'); g.fillStyle = '#8a8f8a'; g.fillRect(1, 1, 10, 10);
    g.fillStyle = '#000000'; g.fillRect(2.5, 2.5, 7, 7);
    map.addImage('citypt', g.getImageData(0, 0, 12, 12), { pixelRatio: 2 });
    map.addSource('cities', { type: 'geojson', data: cities });
    const weight = ['*', ['get', 'pop'], ['case', ['==', ['get', 'cap'], 1], 3, 1]];
    const tier = ['step', ['zoom'], ['>=', weight, 2200000], 2.4, ['>=', weight, 1000000], 4.0, true];
    map.addLayer({ id: 'citylbl', type: 'symbol', source: 'cities', minzoom: 0.8, filter: tier,
      layout: { 'icon-image': 'citypt', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
                // SMALLER (user, 2026-09-29; were 7.5 → 10): cities are context, not the subject
                'text-size': ['interpolate', ['linear'], ['zoom'], 1, 6.5, 4, 7.5, 7, 8.5],
                'symbol-sort-key': ['-', 0, weight],
                'text-offset': [0, -0.55], 'text-anchor': 'bottom', 'text-max-width': 8, 'text-padding': 3 },
      paint: { 'text-color': '#000000', 'text-halo-color': '#8a8f8a', 'text-halo-width': 1.3 } });
  }
  // lake names in BLUE, and FEWER of them (user, 2026-09-29): a lake is named
  // only once it is big enough on screen for the zoom — the great lakes from
  // z2.5, mid-sized by z5, everything drawn by z7 — with room around each name
  if (lakes) map.addLayer({ id: 'lakelbl', type: 'symbol', source: 'lakes', minzoom: 2.5,
    filter: ['all', ['!=', ['get', 'name'], ''],
      ['step', ['zoom'], ['>=', ['get', 'a'], 6], 4, ['>=', ['get', 'a'], 1.2], 5, ['>=', ['get', 'a'], 0.25], 7, true]],
    layout: { 'symbol-placement': 'point', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
              // BIGGER on the phone (user, 2026-09-29; were 7.5 → 10.5)
              'text-size': ['interpolate', ['linear'], ['zoom'], 3, 10.5, 7, 14.5], 'text-max-width': 7, 'text-padding': 10,
              'symbol-sort-key': ['-', 0, ['get', 'a']] },
    paint: { 'text-color': '#6ea8e0', 'text-halo-color': '#0d0d0d', 'text-halo-width': 1.1, 'text-opacity': 0.95 } });
  if (labels) {
    map.addSource('admin', { type: 'geojson', data: labels });
    // COUNTRY and STATE names, as on the database's map (user, 2026-09-29):
    // countries in spaced capitals from world zoom, states in plain type from
    // z3.2, the same greys and halo. A size larger than the site's — a phone
    // is read at arm's length.
    map.addLayer({ id: 'adminlbl', type: 'symbol', source: 'admin', minzoom: 1.4,
      filter: ['step', ['zoom'], ['==', ['get', 'lvl'], 0], 3.2, true],
      layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'],
                  1.5, ['case', ['==', ['get', 'lvl'], 0], 9.5, 10.5],
                  5, ['case', ['==', ['get', 'lvl'], 0], 11.5, 12]],
                'text-transform': ['case', ['==', ['get', 'lvl'], 0], 'uppercase', 'none'],
                'text-letter-spacing': ['case', ['==', ['get', 'lvl'], 0], 0.18, 0.05],
                'text-padding': 8 },
      paint: { 'text-color': ['case', ['==', ['get', 'lvl'], 0], '#9aa1a8', '#878e97'],
               'text-halo-color': '#0a0d12', 'text-halo-width': 1.3, 'text-opacity': 0.85 } });
  }
  // TRAILS (user, 2026-09-28): NPS Public Trails, orange dashed, lazy-loaded
  // (5 MB) the first time the map is zoomed in far enough to read them
  const loadTrails = () => {
    if (map.getSource('trails') || map.getZoom() < 5.5) return;
    map.off('zoomend', loadTrails);
    fetch('data/trails.geojson', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(t => {
      if (!t || map.getSource('trails')) return;
      map.addSource('trails', { type: 'geojson', data: t });
      map.addLayer({ id: 'trails', type: 'line', source: 'trails', minzoom: 5.5,
        paint: { 'line-color': '#ff8c1a', 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.6, 9, 1.4, 12, 2.2],
                 'line-opacity': 0.95,
                 'line-dasharray': ['step', ['zoom'], ['literal', [7, 11]], 7, ['literal', [4.5, 6.5]],
                   8.5, ['literal', [3, 4.5]], 10, ['literal', [2.4, 3.6]], 11.5, ['literal', [2, 3]]] } },
        'selglow');
      map.addLayer({ id: 'traillbl', type: 'symbol', source: 'trails', minzoom: 8.8, filter: ['!=', ['get', 'name'], ''],
        layout: { 'symbol-placement': 'point', 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Regular'],
                  'text-size': 9, 'text-padding': 6, 'text-max-width': 8, 'text-offset': [0, 0.8], 'text-anchor': 'top' },
        paint: { 'text-color': '#ffa040', 'text-halo-color': '#0d0d0d', 'text-halo-width': 1.1, 'text-opacity': 0.9 } });
    }).catch(() => {});
  };
  map.on('zoomend', loadTrails); loadTrails();
  // 3D TERRAIN for the picker (2026-09-29): the explorer's DEM, gentler —
  // without height the phone's subtle tilt would just skew a flat sheet
  if (MINI == null) { try {
    map.addSource('dem', { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 13, tiles: [TERRAIN] });
    map.setTerrain({ source: 'dem', exaggeration: 3 });
  } catch (e) {} }
  ready = true;
  if (MINI != null) {
    // the site's minimap: just the region, green, in continental context
    for (const id of ['ecolbl', 'parkdot', 'parklbl', 'lakelbl']) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
    setSelected(MINI);
    const b = bboxOf(MINI);
    if (b) map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 28, duration: 0, maxZoom: 3.6 });
    // ALWAYS LOADED on the Camp page (user, 2026-09-29): once everything has
    // drawn, the page sends a JPEG of itself; the app keeps it per ecoregion
    // and shows the picture instantly from then on, online or off
    const snap = () => { try { send({ type: 'snapshot', eid: MINI, data: map.getCanvas().toDataURL('image/jpeg', 0.82) }); } catch (e) {} };
    map.once('idle', () => setTimeout(snap, 400));
    return;
  }
  if (pendingState) applyState(pendingState);
  send({ type: 'ready' });
  // the sheet follows the pin WHILE the map moves (2026-09-30): report() dedupes,
  // so a pan that stays in one region sends nothing extra
  map.on('move', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (MINI == null) { report(); sendPan(); } else highlightPin(); }); });
  // report at moveend AND once the tiles for the new view have rendered —
  // right after a fly-to the region under the pin often isn't drawn yet, and
  // queryRenderedFeatures only sees what's drawn
  if (MINI == null) {
    map.on('moveend', settle);
    map.once('idle', report);
    // the HD twins arrive from a worker: report again the moment they're drawn
    map.on('sourcedata', e => { if (e.sourceId === 'ecohd' && e.isSourceLoaded) report(); });
  }
});

// HOW FAR THE WORLD SLID UNDER THE PIN this frame, in screen pixels (user,
// 2026-09-30: the pin leans against the drag like a thing stuck in the
// ground) — where last frame's centre sits now, relative to the centre
let lastCenter = null;
function sendPan() {
  const c = map.getCenter();
  if (lastCenter) {
    const p = map.project(lastCenter), o = map.project(c);
    const dx = p.x - o.x, dy = p.y - o.y;
    if (Math.abs(dx) + Math.abs(dy) > 0.2) send({ type: 'pan', dx: +dx.toFixed(1), dy: +dy.toFixed(1) });
  }
  lastCenter = c;
}
// the pin: centre of the visible map (screen minus the app's chrome)
let raf = 0;
const pinPoint = () => { const c = map.getContainer(); return [c.clientWidth / 2, (PAD.top + (c.clientHeight - PAD.bottom)) / 2]; };
function regionAtPin() {
  try {
    const pt = pinPoint();
    return map.queryRenderedFeatures(pt, { layers: ['land_hd'] })[0] || map.queryRenderedFeatures(pt, { layers: ['land_pick'] })[0] || null;
  } catch (e) { return null; }
}
function highlightPin() {
  const f = regionAtPin();
  setSelected(f ? f.properties.eco : null);
}
// after a move: report now, and again as the new view's tiles land. Timers,
// not only 'idle' — on a phone the motion tilt moves the camera many times a
// second, so the map can go a long while without ever being idle. report()
// dedupes, so the extra looks are free.
let settleTimers = [];
function settle() {
  report();
  if (settleTimers.length) return;
  settleTimers = [250, 700, 1500, 3000].map(ms => setTimeout(report, ms));
  setTimeout(() => { settleTimers = []; }, 3000);
  if (!idleQueued) { idleQueued = true; map.once('idle', () => { idleQueued = false; report(); }); }
}
let idleQueued = false;   // tilt fires moveend many times a second: one idle follow-up at a time
let lastReported;
// NO FLICKER (user, 2026-09-30: "don't make it so sensitive"): along a border
// the pin's read can alternate every frame. A different region only takes
// over once it has been under the pin for 140ms straight (a fling across a
// region still reads it — a beat is a handful of frames).
let candidate, candidateSince = 0;
const STEADY_MS = 140;
function report() {
  const f = regionAtPin(), eid = f ? f.properties.eco : null;
  if (eid !== candidate) { candidate = eid; candidateSince = performance.now(); if (eid !== current) setTimeout(report, STEADY_MS + 10); }
  if (eid === current && eid === lastReported) return;
  if (performance.now() - candidateSince < STEADY_MS) return;
  setSelected(eid);
  if (eid === lastReported) return;
  lastReported = eid;
  send(f ? { type: 'center', eid, name: f.properties.name, bbox: bboxOf(eid) } : { type: 'center', eid: null });
}

function applyState(s) {
  if (!ready) { pendingState = s; return; }
  let padChanged = false;
  if (s.pad) {
    const np = { top: +s.pad.top || 0, bottom: +s.pad.bottom || 0 };
    padChanged = np.top !== PAD.top || np.bottom !== PAD.bottom;
    PAD = np;
    // the camera's centre IS the pin: every move, zoom and tilt pivots there.
    // ONLY when it changed: setPadding is a camera move, and a camera move
    // cancels a flight in progress — re-applying it on every state update
    // stopped the map flying to your camp on launch (found 2026-09-29)
    if (padChanged) map.setPadding({ top: PAD.top, bottom: PAD.bottom, left: 0, right: 0 });
  }
  if (Array.isArray(s.collected)) collected = s.collected;
  if (Array.isArray(s.completed)) completed = s.completed;
  if (s.progress && typeof s.progress === 'object') progress = s.progress;
  if (s.camp !== undefined) camp = s.camp;
  applyFilters();
  if (s.fly && s.current != null) flyTo(s.current);
  else if (padChanged) report();   // the pin moved with the padding: re-read what's under it
}
function flyTo(eid) {
  const b = bboxOf(eid);
  if (!b) return;
  // padding = the app's chrome, so the region is centred on the pin
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 30, maxZoom: 6.5, duration: 1200 });   // on top of the map's own padding
}
let prevSel = null, fadeRaf = 0;
const SEL_OPACITY = { fill: 0.45, glow: 0.6, line: 1 };
function setSelected(eid) {
  if (eid === current) return;
  prevSel = current;
  current = eid == null ? null : eid;
  applyFilters();
  // fade: the old region's layers 1 → 0, the new region's 0 → 1, over 320ms
  const t0 = performance.now(), D = 490;   // 320 → "slower" 650 → "25% faster" (user, 2026-09-30)
  if (fadeRaf) cancelAnimationFrame(fadeRaf);
  const step = () => {
    const t = Math.min(1, (performance.now() - t0) / D), e = t * (2 - t);   // ease-out
    setSelOpacity('sel', e); setSelOpacity('psel', 1 - e);
    if (t < 1) fadeRaf = requestAnimationFrame(step); else { fadeRaf = 0; prevSel = null; applyFilters(); }
  };
  step();
}
function setSelOpacity(prefix, k) {
  const set = (id, prop, v) => { if (map.getLayer(id)) map.setPaintProperty(id, prop, v); if (map.getLayer(id + '_hd')) map.setPaintProperty(id + '_hd', prop, v); };
  set(prefix + 'fill', 'fill-opacity', SEL_OPACITY.fill * k);
  set(prefix + 'glow', 'line-opacity', SEL_OPACITY.glow * k);
  set(prefix + 'line', 'line-opacity', SEL_OPACITY.line * k);
}
// every ecoregion layer's filter, in one place: the low-detail layer skips
// regions that have their high-detail twin loaded
const HD = new Map();            // eco id → its high-detail feature
function applyFilters() {
  const hd = ['literal', [...HD.keys()]], notHD = ['!', ['in', ['get', 'eco'], hd]];
  const sel = ['==', ['get', 'eco'], current == null ? -1 : current], vis = ['in', ['get', 'eco'], ['literal', collected]];
  const put = (id, f) => { if (map.getLayer(id)) map.setFilter(id, ['all', f, notHD]); if (map.getLayer(id + '_hd')) map.setFilter(id + '_hd', f); };
  if (map.getLayer('land')) map.setFilter('land', notHD);
  if (map.getLayer('ecoline')) map.setFilter('ecoline', notHD);
  for (const id of ['selfill', 'selglow', 'selline']) put(id, sel);
  const psel = ['==', ['get', 'eco'], prevSel == null ? -1 : prevSel];
  for (const id of ['pselfill', 'pselglow', 'pselline']) put(id, psel);
  put('visited', vis);
  put('visitfill', vis);
  // MASTERY COLOURS (user, 2026-09-30): each visited region's inside goes
  // from a dark green (nothing mastered) to a bright green (nearly all), and
  // GOLD once the whole deck is mastered — one 'match' expression, mixed here
  const mix = (t) => { const a = [0x1e, 0x5a, 0x24], b = [0x6e, 0xff, 0x62];   // dark → bright green
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, t))).toString(16).padStart(2, '0')).join(''); };
  const pairs = [];
  for (const e of collected) { const p = progress[e] || 0; pairs.push(+e, p >= 1 || completed.includes(+e) ? '#FFD700' : mix(p)); }
  const color = pairs.length ? ['match', ['get', 'eco'], ...pairs, mix(0)] : mix(0);
  for (const id of ['visitfill', 'visitfill_hd']) if (map.getLayer(id)) map.setPaintProperty(id, 'fill-color', color);
  for (const id of ['campglow', 'campline']) put(id, ['==', ['get', 'eco'], camp == null ? -1 : camp]);
}
// load the high-detail outline of everything on screen, once zoomed in
const hdBusy = new Set();
function loadHD() {
  if (MINI != null || !ready || map.getZoom() < 5.5) return;
  let ids = [];
  try { ids = [...new Set(map.queryRenderedFeatures({ layers: ['land'] }).map(f => f.properties.eco))]; } catch (e) { return; }
  // nothing under the pin? The coarse outline may simply have lost this spot
  // (a bay island, a sliver of coast): also try the regions whose bounding
  // box holds the pin, smallest first — the detailed outline decides
  if (!regionAtPin()) {
    const c = map.unproject(pinPoint());
    ids = ids.concat(boxesAt(c.lng, c.lat).slice(0, 4));
  }
  ids = [...new Set(ids)].filter(e => !HD.has(e) && !hdBusy.has(e)).slice(0, 14);
  if (!ids.length) return;
  ids.forEach(e => hdBusy.add(e));
  Promise.all(ids.map(e => fetch('data/eco_hd/' + e + '.json').then(r => r.ok ? r.json() : null).catch(() => null)
    .then(fc => { const f = fc && (fc.features ? fc.features[0] : fc); if (f && f.geometry) { f.properties = Object.assign({}, f.properties, { eco: e }); HD.set(e, f); } })))
    .then(() => {
      ids.forEach(e => hdBusy.delete(e));
      if (HD.size > 70) for (const k of [...HD.keys()].slice(0, HD.size - 70)) HD.delete(k);   // oldest out
      map.getSource('ecohd').setData({ type: 'FeatureCollection', features: [...HD.values()] });
      applyFilters();
      settle();
      // the rest of the screen, if it was more than one batch — a timer too,
      // since 'idle' may never come while the phone is tilting the map
      map.once('idle', loadHD); setTimeout(loadHD, 1200);
    });
}
// regions whose bounding box contains a point, smallest box first
function boxesAt(x, y) {
  if (!GEO) return [];
  const seen = new Map();
  for (const f of GEO.features) {
    const e = f.properties.eco; if (seen.has(e)) continue;
    const b = bboxOf(e); seen.set(e, b);
  }
  return [...seen].filter(([, b]) => b && x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3])
    .sort((p, q) => (p[1][2] - p[1][0]) * (p[1][3] - p[1][1]) - (q[1][2] - q[1][0]) * (q[1][3] - q[1][1])).map(([e]) => e);
}
function bboxOf(eid) {
  // our own parsed copy — MapLibre's source._data is not the feature collection
  if (!GEO) return null;
  let w = 180, s = 90, e = -180, n = -90, hit = false;
  for (const f of GEO.features) {
    if (f.properties.eco !== eid) continue; hit = true;
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const p of polys) for (const [x, y] of p[0]) { if (x < w) w = x; if (x > e) e = x; if (y < s) s = y; if (y > n) n = y; }
  }
  return hit ? [w, s, e, n] : null;
}

// a tap slides the tapped spot under the pin (moveend then reports it)
map.on('click', ev => { map.easeTo({ center: ev.lngLat, duration: 500 }); });

// messages from the app (iOS delivers to window, Android to document)
const onMsg = ev => { try { applyState(JSON.parse(ev.data)); } catch (e) {} };
window.addEventListener('message', onMsg);
document.addEventListener('message', onMsg);
window.polygroveSetState = applyState;   // injectJavaScript entry points
// the app's + / − buttons: zoom around the pin so what's under it stays put
// the app's compass: set the bearing (degrees, around the pin); the page
// reports its bearing back on every rotate so the needle follows the map
window.polygroveBearing = (deg, animate) => { if (!ready) return;
  const o = { bearing: deg, around: map.unproject(pinPoint()) };
  if (animate) map.easeTo(Object.assign(o, { duration: 350 })); else map.jumpTo(o); };
let _lastBearing = null;
map.on('rotate', () => { const b = Math.round(map.getBearing() * 10) / 10;
  if (b !== _lastBearing) { _lastBearing = b; send({ type: 'bearing', deg: b }); } });
window.polygroveZoom = d => { if (ready) map.easeTo({ zoom: map.getZoom() + d, duration: 300 }); };
// SUBTLE MOTION (user, 2026-09-29: "as much as the new Photos widget, very
// subtle"): the app feeds the phone's tilt as a few degrees of pitch and
// bearing; over real terrain that reads as depth. Ignored while a finger is
// on the map, so it never fights a drag or a pinch.
let touching = false;
for (const [ev, v] of [['touchstart', true], ['touchend', false], ['touchcancel', false]])
  map.getCanvasContainer().addEventListener(ev, e => { touching = v ? true : e.touches.length > 0; }, { passive: true });
window.polygroveTilt = (pitch, bearing) => { if (ready && !touching && !map.isEasing()) map.jumpTo({ pitch, bearing }); };
</script>
</body>
